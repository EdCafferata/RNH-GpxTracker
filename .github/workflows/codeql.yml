name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      # Autobuild bouwt met -target en vindt dan de Swift-packages (CoreGPX) niet; bouw via het scheme.
      # Device-build (ongesigneerd): het scheme bevat een Watch-app en die kan niet voor de iOS-simulator.
      - name: Build
        run: |
          xcodebuild build -project OpenRHNTracker.xcodeproj -scheme OpenRHNTracker \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
