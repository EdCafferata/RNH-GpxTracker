disabled_rules:
  - trailing_whitespace
  - nesting
  - identifier_name

excluded:
  - Pods

line_length: 150


# try and remove these after we refactor some concerns out of the main view controller
# ViewController is ~910 regels (na het afsplitsen van WeatherService). Verder opsplitsen = backlog #3;
# tot die tijd een error-grens die de build niet blokkeert, wél een waarschuwing.
type_body_length:
  - 300 # warning
  - 1000 # error
# PreferencesTableViewController.cellForRow is één grote switch per sectie (complexiteit 25).
cyclomatic_complexity:
  - 10 # warning
  - 30 # error
function_body_length:
  - 50
  - 250
